services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pharmatrace_agents
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pharmatrace_agents"]
      interval: 5s
      timeout: 3s
      retries: 15

  orchestrator:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pharmatrace_agents
      SECRET_STORAGE_DIR: /app/.secrets
    command: ["sh", "-c", "node dist/database/migrate.js && node dist/main.js"]
    ports:
      - "3000:3000"
    volumes:
      - encrypted_secrets:/app/.secrets

volumes:
  postgres_data:
  encrypted_secrets:
