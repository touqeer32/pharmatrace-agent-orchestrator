{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "pharmatrace-agent-orchestrator.fullname" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pharmatrace-agent-orchestrator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "pharmatrace-agent-orchestrator.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "pharmatrace-agent-orchestrator.serviceAccountName" . }}
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/database/migrate.js"]
          envFrom:
            - configMapRef:
                name: {{ include "pharmatrace-agent-orchestrator.fullname" . }}-config
            - secretRef:
                name: {{ .Values.secret.existingName }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
{{- end }}

