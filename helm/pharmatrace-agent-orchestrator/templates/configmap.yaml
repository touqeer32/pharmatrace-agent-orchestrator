apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pharmatrace-agent-orchestrator.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pharmatrace-agent-orchestrator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  PORT: {{ .Values.service.targetPort | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  DATABASE_POOL_MAX: {{ .Values.config.databasePoolMax | quote }}
  DATABASE_SSL: {{ .Values.config.databaseSsl | quote }}
  DATABASE_SSL_REJECT_UNAUTHORIZED: {{ .Values.config.databaseSslRejectUnauthorized | quote }}
  AUDIT_DB_HOST: {{ .Values.config.auditDbHost | quote }}
  AUDIT_DB_PORT: {{ .Values.config.auditDbPort | quote }}
  AUDIT_DB_NAME: {{ .Values.config.auditDbName | quote }}
  AUDIT_DB_USER: {{ .Values.config.auditDbUser | quote }}
  AUDIT_DB_SSL_MODE: {{ .Values.config.auditDbSslMode | quote }}
  AUDIT_DATABASE_POOL_MAX: {{ .Values.config.auditDatabasePoolMax | quote }}
  SCHEDULER_POLL_INTERVAL_MS: {{ .Values.config.schedulerPollIntervalMs | quote }}
  EXECUTION_POLL_INTERVAL_MS: {{ .Values.config.executionPollIntervalMs | quote }}
  EXECUTION_CONCURRENCY: {{ .Values.config.executionConcurrency | quote }}
  MCP_REQUEST_TIMEOUT_MS: {{ .Values.config.mcpRequestTimeoutMs | quote }}
  NVIDIA_EXECUTION_TIMEOUT_SECONDS: {{ .Values.config.nvidiaExecutionTimeoutSeconds | quote }}
  DEBUG_GRAPHQL_REQUESTS: {{ .Values.config.debugGraphqlRequests | quote }}
  DEBUG_LLM_RESPONSES: {{ .Values.config.debugLlmResponses | quote }}
  DEBUG_MCP_TOOL_RESULTS: {{ .Values.config.debugMcpToolResults | quote }}
  COMPLIANCE_DEMO_ENABLED: {{ .Values.config.complianceDemoEnabled | quote }}
  HEDERA_NETWORK: {{ .Values.config.hederaNetwork | quote }}
  HEDERA_TOPIC_ID: {{ .Values.config.hederaTopicId | quote }}
  HEDERA_TOPIC_ID_TESTNET: {{ .Values.config.hederaTopicIdTestnet | quote }}
  HEDERA_TOPIC_ID_MAINNET: {{ .Values.config.hederaTopicIdMainnet | quote }}
  HEDERA_RPC_URL: {{ .Values.config.hederaRpcUrl | quote }}
  HEDERA_RPC_URL_TESTNET: {{ .Values.config.hederaRpcUrlTestnet | quote }}
  HEDERA_RPC_URL_MAINNET: {{ .Values.config.hederaRpcUrlMainnet | quote }}
  MIRROR_NODE_URL: {{ .Values.config.mirrorNodeUrl | quote }}
  MIRROR_NODE_URL_TESTNET: {{ .Values.config.mirrorNodeUrlTestnet | quote }}
  MIRROR_NODE_URL_MAINNET: {{ .Values.config.mirrorNodeUrlMainnet | quote }}
  PHARMATRACE_GRAPHQL_URL: {{ .Values.config.pharmatraceGraphqlUrl | quote }}
  KEYCLOAK_TOKEN_URL: {{ .Values.config.keycloakTokenUrl | quote }}
  KEYCLOAK_CLIENT_ID: {{ .Values.config.keycloakClientId | quote }}
  KEYCLOAK_GRANT_TYPE: {{ .Values.config.keycloakGrantType | quote }}
  PHARMATRACE_MANAGER_ADDRESS: {{ .Values.config.pharmatraceManagerAddress | quote }}
  PHARMATRACE_MANAGER_ADDRESS_TESTNET: {{ .Values.config.pharmatraceManagerAddressTestnet | quote }}
  PHARMATRACE_MANAGER_ADDRESS_MAINNET: {{ .Values.config.pharmatraceManagerAddressMainnet | quote }}
  PHARMATRACE_MIRROR_NODE_URL: {{ .Values.config.pharmatraceMirrorNodeUrl | quote }}
  PHARMATRACE_MIRROR_NODE_URL_TESTNET: {{ .Values.config.pharmatraceMirrorNodeUrlTestnet | quote }}
  PHARMATRACE_MIRROR_NODE_URL_MAINNET: {{ .Values.config.pharmatraceMirrorNodeUrlMainnet | quote }}
  OLLAMA_BASE_URL: {{ .Values.config.ollamaBaseUrl | quote }}
  NVIDIA_BASE_URL: {{ .Values.config.nvidiaBaseUrl | quote }}
  OPENAI_USE_CHAT_COMPLETIONS: {{ .Values.config.openaiUseChatCompletions | quote }}
  LLM_BOOTSTRAP_ENABLED: {{ .Values.config.llmBootstrapEnabled | quote }}
  LLM_BOOTSTRAP_AGENT_NAME: {{ .Values.config.llmBootstrapAgentName | quote }}
  LLM_BOOTSTRAP_PROVIDER: {{ .Values.config.llmBootstrapProvider | quote }}
  LLM_BOOTSTRAP_MODEL: {{ .Values.config.llmBootstrapModel | quote }}
  LLM_BOOTSTRAP_CONNECTION_NAME: {{ .Values.config.llmBootstrapConnectionName | quote }}
  LLM_BOOTSTRAP_BASE_URL: {{ .Values.config.llmBootstrapBaseUrl | quote }}
  LLM_BOOTSTRAP_API_KEY_REF: {{ .Values.config.llmBootstrapApiKeyRef | quote }}
  SECRET_STORAGE_DIR: {{ .Values.config.secretStorageDir | quote }}
