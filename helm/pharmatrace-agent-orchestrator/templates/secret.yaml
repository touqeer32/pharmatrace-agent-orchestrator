{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.existingName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pharmatrace-agent-orchestrator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
{{- if and (eq (upper (toString .Values.config.llmBootstrapProvider)) "ANTHROPIC") (eq (toString .Values.config.llmBootstrapEnabled) "true") }}
{{- $anthropicKey := index .Values.secret.data "ANTHROPIC_API_KEY" | default "" }}
{{- $_ := required "secret.data.ANTHROPIC_API_KEY is required when Anthropic LLM bootstrap is enabled" $anthropicKey }}
{{- end }}
type: Opaque
stringData:
  {{- required "secret.data must be provided when secret.create=true" .Values.secret.data | toYaml | nindent 2 }}
{{- end }}
