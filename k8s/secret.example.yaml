apiVersion: v1
kind: Secret
metadata:
  name: pharmatrace-agent-orchestrator-secrets
  namespace: serialization
type: Opaque
stringData:
  DATABASE_URL: postgresql://postgres:CHANGE_ME@serialization-pg16.remote-systems.svc.cluster.local:5432/pharmatrace_agents
  AUDIT_DB_PASSWORD: CHANGE_ME
  SERVICE_API_KEY: CHANGE_ME
  OPENAI_API_KEY: CHANGE_ME
  ANTHROPIC_API_KEY: CHANGE_ME
  OLLAMA_BASE_URL: https://ollama.com/v1
  OLLAMA_API_KEY: ollama
  NVIDIA_API_KEY: CHANGE_ME_NVIDIA_API_KEY
  PHARMATRACE_GRAPHQL_URL: https://apigateway.k8s.pharmatrace.io/graphql
  KEYCLOAK_TOKEN_URL: https://kc.k8s.pharmatrace.io/auth/realms/first-bucket/protocol/openid-connect/token
  KEYCLOAK_CLIENT_ID: api
  KEYCLOAK_CLIENT_SECRET: CHANGE_ME
  KEYCLOAK_USERNAME: CHANGE_ME_PREFERRED_USERNAME
  KEYCLOAK_PASSWORD: CHANGE_ME_USER_PASSWORD
  KEYCLOAK_GRANT_TYPE: password
  # Required for automatic agent-created report submission to HCS.
  AGENT_HEDERA_ACCOUNT_ID: 0.0.xxxxx
  AGENT_HEDERA_KEY_TYPE: ECDSA
  AGENT_HEDERA_PRIVATE_KEY: CHANGE_ME_AGENT_PRIVATE_KEY
  # Optional display identity stored on the report row.
  AGENT_REPORT_CREATOR_PUBLIC_KEY: CHANGE_ME_AGENT_PUBLIC_KEY
  # Used when the service creates encrypted provider-secret references.
  SECRET_ENCRYPTION_KEY: CHANGE_ME_32_BYTE_BASE64_KEY
